[package]
name = "metalmd"
version = "0.2.3"
authors = ["Fan4_Metal"]
edition = "2024"
description = "Fast Markdown viewer for Windows"
license = "MIT"
repository = "https://github.com/Fan4Metal/metalmd"
rust-version = "1.95"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.36.2"
egui_extras = { version = "0.36.2", features = ["image", "file", "http", "gif", "webp"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
resvg = { version = "0.45.1", default-features = false, features = ["text"] }
# Already used by resvg; its Emoji_Presentation table.
unicode-properties = { version = "0.1.4", default-features = false, features = ["emoji"] }
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-types = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["embed-fonts"] }
mermaid-svg = "0.7.0"
comrak = { version = "0.56.0", default-features = false }
regex = "1"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
notify = "8.2"
interprocess = "2.4.4"
rfd = "0.17.2"
directories = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8.42"
chardetng = "1.0.0"
open = "5.4.4"
raw-window-handle = "0.6"
# Already used by resvg and RaTeX: the system's font families, for the Text panel.
fontdb = { version = "0.23.0", default-features = false, features = ["fs", "memmap"] }
# Already used by egui, which reads fonts with it: a chosen font is checked with it first.
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
# Printing and PDF through WebView2, loaded only when asked to print. Its
# loader is linked statically, so no WebView2Loader.dll ships.
webview2-com = "0.39.1"
# Already used by webview2-com: the window and the COM calls around it.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinHttp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
